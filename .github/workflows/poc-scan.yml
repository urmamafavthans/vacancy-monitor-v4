name: Vacancy Monitor v4 — POC Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/poc-scan.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vacancy-monitor-v4-poc
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: projects/201635773621/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: vacancy-monitor@project-971fb5f9-f8e1-41d2-93e.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser fallback
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npm test

      - name: Run three-source POC scan
        run: npm run scan:poc
        env:
          SPREADSHEET_ID: 1g_2mRUa8M7DouWljcZyDuj_oLKdZiyLHS5SeBOTbVOE
          CRAWLEE_STORAGE_DIR: ${{ runner.temp }}/vacancy-monitor-crawlee
          CI: 'true'

      - name: Review POC acceptance gates
        run: npm run review:poc
        env:
          SPREADSHEET_ID: 1g_2mRUa8M7DouWljcZyDuj_oLKdZiyLHS5SeBOTbVOE
